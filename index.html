<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afinador de Guitarra</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@300;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131c;
    --border: #1e1e2e;
    --accent: #e8c547;
    --text: #e8e6e0;
    --muted: #4a4860;
    --green: #48e87a;
    --red: #e84848;
    --blue: #48a8e8;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .app {
    width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  /* Top row: title + mic */
  .top-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .title-block { line-height: 1; }
  .t1 {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.55rem;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .t2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .mic-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    position: relative;
    flex-shrink: 0;
  }
  .mic-btn.active {
    background: var(--accent);
    box-shadow: 0 0 20px rgba(232,197,71,0.35);
  }
  .mic-btn.active .mic-icon { color: var(--bg); }
  .mic-btn::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(232,197,71,0.15);
    animation: pulse 2s ease infinite;
    opacity: 0;
  }
  .mic-btn.active::after { opacity: 1; }
  @keyframes pulse {
    0%   { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .mic-icon { color: var(--accent); transition: color 0.2s; }

  /* Main display — horizontal layout */
  .main-display {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
  }

  /* Small ring */
  .ring-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    flex-shrink: 0;
  }
  .ring-svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg   { fill: none; stroke: var(--border); stroke-width: 4; }
  .ring-prog {
    fill: none; stroke: var(--accent); stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 251;
    stroke-dashoffset: 251;
    transition: stroke-dashoffset 0.1s ease, stroke 0.2s ease;
  }
  .ring-inner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1px;
  }
  .note-big {
    font-family: 'Unbounded', sans-serif;
    font-size: 2rem; font-weight: 900;
    line-height: 1; letter-spacing: -0.04em;
    color: var(--text);
    transition: color 0.2s ease;
  }
  .freq-small {
    font-size: 0.5rem; color: var(--muted); letter-spacing: 0.08em;
  }

  /* Info column */
  .info-col {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 0.5rem;
  }

  .cents-row {
    display: flex; align-items: baseline; gap: 0.4rem;
  }
  .cents-val {
    font-family: 'Unbounded', sans-serif;
    font-size: 1.5rem; font-weight: 700;
    color: var(--accent);
    transition: color 0.2s ease;
    line-height: 1;
  }
  .cents-label { font-size: 0.55rem; color: var(--muted); letter-spacing: 0.1em; }

  .status-text {
    font-size: 0.6rem;
    font-family: 'Unbounded', sans-serif;
    font-weight: 400;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    transition: color 0.2s ease;
    min-height: 1em;
  }

  /* Meter */
  .meter-wrap { display: flex; flex-direction: column; gap: 3px; }
  .meter-labels {
    display: flex; justify-content: space-between;
    font-size: 0.48rem; color: var(--muted); letter-spacing: 0.06em;
  }
  .meter-bar {
    position: relative; height: 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 2px; overflow: hidden;
  }
  .meter-zones { position: absolute; inset: 0; display: flex; }
  .zone-low  { flex: 1; background: rgba(232,72,72,0.07); }
  .zone-ok   { flex: 0 0 20%; background: rgba(72,232,122,0.13); }
  .zone-high { flex: 1; background: rgba(232,72,72,0.07); }
  .meter-mid {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 1px; background: var(--border);
    transform: translateX(-50%);
  }
  .meter-needle {
    position: absolute; top: 2px; bottom: 2px;
    width: 3px; border-radius: 2px;
    background: var(--accent); left: 50%;
    transform: translateX(-50%);
    transition: left 0.1s ease, background 0.2s ease;
  }

  /* Strings row */
  .strings-wrap { width: 100%; }
  .str-label {
    font-size: 0.48rem; color: var(--muted);
    letter-spacing: 0.18em; text-transform: uppercase;
    text-align: center; margin-bottom: 0.4rem;
  }
  .strings-row {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.3rem;
  }
  .str-btn {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0.45rem 0.2rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; cursor: pointer;
    transition: all 0.15s ease; color: var(--muted);
    font-family: 'Space Mono', monospace;
  }
  .str-btn:hover { border-color: var(--accent); color: var(--accent); }
  .str-btn.active {
    background: rgba(232,197,71,0.09);
    border-color: var(--accent); color: var(--accent);
  }
  .str-num  { font-size: 0.42rem; opacity: 0.45; margin-bottom: 1px; }
  .str-note { font-family: 'Unbounded', sans-serif; font-size: 0.75rem; font-weight: 700; }
  .str-hz   { font-size: 0.38rem; opacity: 0.35; margin-top: 1px; }

  /* State colors */
  .c-ok   { color: var(--green) !important; }
  .c-low  { color: var(--blue)  !important; }
  .c-high { color: var(--red)   !important; }
  .n-ok   { background: var(--green) !important; }
  .n-low  { background: var(--blue)  !important; }
  .n-high { background: var(--red)   !important; }
  .r-ok   { stroke: var(--green) !important; }
  .r-low  { stroke: var(--blue)  !important; }
  .r-high { stroke: var(--red)   !important; }
</style>
</head>
<body>
<div class="app">

  <!-- Header row -->
  <div class="top-row">
    <div class="title-block">
      <div class="t1">Afinador</div>
      <div class="t2">GUITARRA</div>
    </div>
    <button class="mic-btn" id="micBtn" title="Activar micrófono">
      <svg class="mic-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 1a2.5 2.5 0 0 0-2.5 2.5v5a2.5 2.5 0 0 0 5 0V3.5A2.5 2.5 0 0 0 9 1z"/>
        <path d="M15 8.5v1a6 6 0 0 1-12 0v-1"/>
        <line x1="9" y1="15.5" x2="9" y2="18"/>
        <line x1="6" y1="18" x2="12" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Main panel -->
  <div class="main-display">
    <!-- Ring -->
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 80 80">
        <circle class="ring-bg"   cx="40" cy="40" r="34"/>
        <circle class="ring-prog" id="ringProg" cx="40" cy="40" r="34"/>
      </svg>
      <div class="ring-inner">
        <div class="note-big" id="noteDisplay">—</div>
        <div class="freq-small" id="freqDisplay">— Hz</div>
      </div>
    </div>

    <!-- Info -->
    <div class="info-col">
      <div class="cents-row">
        <div class="cents-val" id="centsDisplay">0</div>
        <div class="cents-label">CENTS</div>
      </div>
      <div class="status-text" id="statusText">Pulsa el mic</div>
      <div class="meter-wrap">
        <div class="meter-labels"><span>♭</span><span>AFINADO</span><span>♯</span></div>
        <div class="meter-bar">
          <div class="meter-zones">
            <div class="zone-low"></div><div class="zone-ok"></div><div class="zone-high"></div>
          </div>
          <div class="meter-mid"></div>
          <div class="meter-needle" id="needle"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Strings -->
  <div class="strings-wrap">
    <div class="str-label">Cuerdas — afinación estándar</div>
    <div class="strings-row" id="stringsGrid"></div>
  </div>

</div>

<script>
  const STRINGS = [
    { num:6, label:'Mi', freq:82.41  },
    { num:5, label:'La', freq:110.00 },
    { num:4, label:'Re', freq:146.83 },
    { num:3, label:'Sol',freq:196.00 },
    { num:2, label:'Si', freq:246.94 },
    { num:1, label:'Mi', freq:329.63 },
  ];
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  let audioCtx=null, analyser=null, stream=null, animFrame=null;
  let isActive=false, selectedString=null;

  const micBtn      = document.getElementById('micBtn');
  const noteDisplay = document.getElementById('noteDisplay');
  const freqDisplay = document.getElementById('freqDisplay');
  const centsDisplay= document.getElementById('centsDisplay');
  const needle      = document.getElementById('needle');
  const statusText  = document.getElementById('statusText');
  const ringProg    = document.getElementById('ringProg');
  const stringsGrid = document.getElementById('stringsGrid');

  const CIRC = 2 * Math.PI * 34; // r=34 → ~213.6

  STRINGS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'str-btn';
    btn.innerHTML = `<span class="str-num">${s.num}</span><span class="str-note">${s.label}</span><span class="str-hz">${s.freq}</span>`;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.str-btn').forEach(b => b.classList.remove('active'));
      selectedString = selectedString === i ? null : (btn.classList.add('active'), i);
    });
    stringsGrid.appendChild(btn);
  });

  function freqToNote(freq) {
    const s = 12 * Math.log2(freq / 440);
    const r = Math.round(s);
    const noteIndex = ((r % 12) + 12) % 12;
    const octave = Math.floor(r / 12) + 4;
    return NOTE_NAMES[noteIndex] + octave;
  }

  function closestString(freq) {
    let best=0, bestD=Infinity;
    STRINGS.forEach((s,i) => { const d=Math.abs(Math.log2(freq/s.freq)*1200); if(d<bestD){bestD=d;best=i;} });
    return best;
  }

  function getPitch(buf, sr) {
    const MAX = Math.floor(buf.length / 2);
    let bestOff=-1, bestCorr=0, lastCorr=1, found=false;
    for (let off=0; off<MAX; off++) {
      let c=0; for(let i=0;i<MAX;i++) c+=Math.abs(buf[i]-buf[i+off]);
      c = 1 - c/MAX;
      if (c > 0.9 && c > lastCorr) { found=true; if(c>bestCorr){bestCorr=c;bestOff=off;} }
      else if (found) break;
      lastCorr=c;
    }
    if (bestOff===-1) return -1;
    return sr / bestOff;
  }

  function getRMS(buf) {
    let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
    return Math.sqrt(s/buf.length);
  }

  function reset() {
    noteDisplay.textContent='—'; freqDisplay.textContent='— Hz';
    centsDisplay.textContent='0'; needle.style.left='50%';
    ringProg.style.strokeDashoffset=CIRC; ringProg.className='ring-prog';
    noteDisplay.className='note-big'; centsDisplay.className='cents-val';
    needle.className='meter-needle'; statusText.className='status-text';
  }

  function updateUI(freq) {
    if (freq < 0) { statusText.textContent = isActive ? 'Escuchando…' : 'Pulsa el mic'; reset(); return; }

    const tidx = selectedString !== null ? selectedString : closestString(freq);
    const target = STRINGS[tidx];
    const tc = Math.round(Math.log2(freq / target.freq) * 1200);
    const abs = Math.abs(tc);

    noteDisplay.textContent = freqToNote(freq);
    freqDisplay.textContent = freq.toFixed(1) + ' Hz';
    centsDisplay.textContent = (tc >= 0 ? '+' : '') + tc;

    needle.style.left = Math.max(0, Math.min(100, (tc + 50) / 100 * 100)) + '%';
    ringProg.style.strokeDashoffset = CIRC * (1 - (1 - Math.min(abs, 50)/50) * 0.75);

    if (abs <= 5) {
      statusText.textContent = '✓ AFINADO';
      [statusText, noteDisplay, centsDisplay].forEach(el => el.classList.add('c-ok'));
      [statusText, noteDisplay, centsDisplay].forEach(el => { el.classList.remove('c-low','c-high'); });
      needle.className='meter-needle n-ok'; ringProg.className='ring-prog r-ok';
    } else if (tc < 0) {
      statusText.textContent = '↑ Sube';
      [statusText, noteDisplay, centsDisplay].forEach(el => { el.classList.remove('c-ok','c-high'); el.classList.add('c-low'); });
      needle.className='meter-needle n-low'; ringProg.className='ring-prog r-low';
    } else {
      statusText.textContent = '↓ Baja';
      [statusText, noteDisplay, centsDisplay].forEach(el => { el.classList.remove('c-ok','c-low'); el.classList.add('c-high'); });
      needle.className='meter-needle n-high'; ringProg.className='ring-prog r-high';
    }
  }

  function loop() {
    if (!analyser) return;
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    const rms = getRMS(buf);
    const freq = rms > 0.01 ? getPitch(buf, audioCtx.sampleRate) : -1;
    updateUI(freq > 60 && freq < 1400 ? freq : -1);
    animFrame = requestAnimationFrame(loop);
  }

  async function start() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 4096;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      isActive=true; micBtn.classList.add('active'); loop();
    } catch(e) { statusText.textContent='Sin acceso al mic'; }
  }

  function stop() {
    if(animFrame) cancelAnimationFrame(animFrame);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    if(audioCtx) audioCtx.close();
    analyser=null; audioCtx=null; stream=null;
    isActive=false; micBtn.classList.remove('active');
    statusText.textContent='Pulsa el mic'; reset();
  }

  micBtn.addEventListener('click', () => isActive ? stop() : start());
</script>
</body>
</html>
